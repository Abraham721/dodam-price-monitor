name: Source diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install locked browser client
        run: npm ci --ignore-scripts
      - name: Inspect server source response without publishing prices
        shell: bash
        run: curl --fail --silent --show-error --max-time 45 --request POST https://dodam-source-probe.pages.dev/probe
      - name: Test ordinary Chrome navigation without challenge solving
        run: node browser-source.mjs --probe
