name: Dodam price monitor
on:
  workflow_dispatch:
    inputs:
      keep_running:
        description: Continue server-side collection every five minutes
        type: boolean
        default: true
      continuation:
        description: Internal server handoff
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 15 * * *'
permissions:
  contents: read
concurrency:
  group: dodam-price-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      snapshot: ${{ steps.collect.outputs.snapshot }}
      attempted_at: ${{ steps.collect.outputs.attempted_at }}
      record_daily: ${{ steps.collect.outputs.record_daily }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate collector
        run: node tests.mjs
      - name: Install locked browser client
        run: npm ci --ignore-scripts
      - name: Collect and verify public prices
        id: collect
        env:
          DODAM_MONITOR_SECRET: ${{ secrets.DODAM_MONITOR_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'attempted_at=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"
          test -n "$DODAM_MONITOR_SECRET"
          result=$(node browser-run.mjs)
          printf '%s\n' "$result"
          printf '%s' "$result" | node --input-type=module -e '
            import {readFileSync, appendFileSync} from "node:fs";
            let raw = ""; for await (const chunk of process.stdin) raw += chunk;
            const result = JSON.parse(raw);
            if (!result.ok || !result.publicVerified || result.products < 30) process.exit(1);
            const day = value => new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Seoul"}).format(new Date(value));
            let previousDay;
            try { previousDay = day(JSON.parse(readFileSync("status.json", "utf8")).observedAt); } catch {}
            appendFileSync(process.env.GITHUB_OUTPUT, `record_daily=${previousDay !== day(result.observedAt)}\n`);
          '
          printf 'snapshot=%s\n' "$result" >> "$GITHUB_OUTPUT"
  continue-monitoring:
    needs: monitor
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.keep_running) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Hand off to the next server run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ATTEMPTED_AT: ${{ needs.monitor.outputs.attempted_at }}
        run: node handoff.mjs
  daily-status:
    needs: monitor
    if: (github.event_name == 'workflow_dispatch' && !inputs.continuation) || needs.monitor.outputs.record_daily == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Record verified daily status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SNAPSHOT: ${{ needs.monitor.outputs.snapshot }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = `https://api.github.com/repos/${process.env.REPOSITORY}/contents/status.json`;
          const headers = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'};
          const previous = await fetch(url, {headers});
          let sha;
          if (previous.ok) sha = (await previous.json()).sha;
          else if (previous.status !== 404) throw new Error(`Status read failed: ${previous.status}`);
          const snapshot = JSON.parse(process.env.SNAPSHOT);
          const result = await fetch(url, {method: 'PUT', headers: {...headers, 'Content-Type': 'application/json'}, body: JSON.stringify({message: 'Record verified collector status [skip ci]', content: Buffer.from(JSON.stringify(snapshot, null, 2) + '\n').toString('base64'), ...(sha ? {sha} : {})})});
          if (!result.ok) throw new Error(`Status update failed: ${result.status}`);
          console.log('Verified collector status recorded.');
          NODE
